[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

# Printful mockups are served through Netlify Image CDN (/.netlify/images?url=…),
# so visitors load them from thebikerbabies.com, resized, and never contact printful.com.
[images]
  remote_images = ['https://files\.cdn\.printful\.com/.*']

# ── Security headers ─────────────────────────────────────────────────────────
# Nothing on the site uses the camera or microphone.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    # Report-only for now: violations appear in the browser console; nothing is blocked.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io; font-src 'self'; connect-src 'self' https://cdn.sanity.io https://*.apicdn.sanity.io; media-src 'self' https://cdn.sanity.io; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Route /api/* requests to Netlify Functions.
# Required for the contact form (src/pages/contact.astro POSTs to
# /api/contact which gets rewritten to /.netlify/functions/contact).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Legacy contact URL → new canonical /contact
# (page renamed from get-in-touch.astro to contact.astro).
[[redirects]]
  from = "/get-in-touch"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/get-in-touch/"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/product/*"
  to = "/products/:splat"
  status = 301
  force = true
